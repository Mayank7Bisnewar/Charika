name: charika_app
description: "Carika - Ride Booking Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^16.0.0

  # Fonts
  google_fonts: ^6.3.0

  # SVG Support
  flutter_svg: ^2.2.0
  google_maps_flutter: ^2.18.0
  maplibre_gl: ^0.26.2
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/